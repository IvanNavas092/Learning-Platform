<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/crear_tarea.css') }}">
    <title>Crear Tarea</title>
</head>
<body>
    <main class="main-container">
        <div class="form-container">
            <h1 class="title">Crear Nueva Tarea</h1>
            <form method="POST" class="task-form">
                {% if mensaje %}
                <div class="mensaje" id="mensaje">{{ mensaje }}</div>
                {% endif %}
                <!-- Selección de Alumno -->
                <label for="alumno">Selecciona un Alumno:</label>
                <select name="alumno" id="alumno" class="input-field" required>
                    {% for alumno in alumnos %}
                        <option value="{{ alumno[0] }}">{{ alumno[0] }}</option>  <!-- Si es una tupla, usa alumno[0] -->
                    {% endfor %}
                </select>
                

                <!-- Nombre de la Tarea -->
                <label for="nombre_tarea">Nombre de la Tarea:</label>
                <input type="text" name="nombre_tarea" id="nombre_tarea" class="input-field" required>

                <!-- Descripción de la Tarea -->
                <label for="descripcion_tarea">Descripción:</label>
                <textarea name="descripcion_tarea" id="descripcion_tarea" class="input-field" required></textarea>

                <!-- Fecha de entrega -->
                <label for="fecha_entrega">Fecha de Entrega:</label>
                <input type="date" name="fecha_entrega" id="fecha_entrega" class="input-field" required>

                <!-- Botón para enviar -->
                <button type="submit" class="submit-btn">Crear Tarea</button>
                
                <!-- Enlace para volver atrás -->
                <a href="{{ url_for('vista_profesor') }}" class="back-link">Volver</a>
            </form>
        </div>
    </main>
</body>
</html>
